<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calculator" aria-label="Calculator">
    <header class="calculator-header">
      <span class="brand-mark" aria-hidden="true">+</span>
      <div>
        <p class="eyebrow">Everyday tool</p>
        <h1>Calculator</h1>
      </div>
      <span class="status-dot" title="Ready"></span>
    </header>

    <section class="display" aria-live="polite">
      <div class="expression" id="expression">Ready</div>
      <div class="result" id="result">0</div>
    </section>

    <section class="keypad" aria-label="Calculator keys">
      <button class="key key-muted" data-action="clear">AC</button>
      <button class="key key-muted" data-action="delete" aria-label="Delete last digit">DEL</button>
      <button class="key key-muted" data-action="percent">%</button>
      <button class="key key-operator" data-operator="divide" aria-label="Divide">÷</button>

      <button class="key" data-number="7">7</button>
      <button class="key" data-number="8">8</button>
      <button class="key" data-number="9">9</button>
      <button class="key key-operator" data-operator="multiply" aria-label="Multiply">×</button>

      <button class="key" data-number="4">4</button>
      <button class="key" data-number="5">5</button>
      <button class="key" data-number="6">6</button>
      <button class="key key-operator" data-operator="subtract" aria-label="Subtract">−</button>

      <button class="key" data-number="1">1</button>
      <button class="key" data-number="2">2</button>
      <button class="key" data-number="3">3</button>
      <button class="key key-operator" data-operator="add" aria-label="Add">+</button>

      <button class="key key-zero" data-number="0">0</button>
      <button class="key" data-action="decimal">.</button>
      <button class="key key-equals" data-action="equals" aria-label="Equals">=</button>
    </section>
    <p class="hint">Use your keyboard to calculate</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
